[project]
name = "scshafe-qt"
version = "0.2.0"
description = "The SCSHAFE native component library: the Scshafe.Ui QML module (Qt Quick) for PySide6 apps, themed from the @scshafe/ui token registry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "scshafe-qt contributors" }]
# The lower bound is the oldest Python CI tests (3.12, 3.13 and 3.14; local
# development uses .python-version, 3.14). PySide6-Essentials 6.11.x wheels
# (abi3, cp310) declare requires-python ">=3.10,<3.15".
requires-python = ">=3.12"
keywords = ["qt", "qml", "pyside6", "qt-quick", "components", "design-tokens", "ui"]
# The license is the SPDX expression above (PEP 639); no License :: classifier.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
]
# Range policy: the library accepts the Qt minor it is built and tested on
# (6.11.x, ">=<tested patch>,<next minor>"); an app pins one exact version in
# its own uv.lock. Open-source Qt patch releases track the current minor
# only (6.8 LTS patches for open source ended at 6.8.3), so the library
# follows the current minor: moving to the next one (6.12) is a minor bump
# of this library with a changelog entry.
dependencies = ["PySide6-Essentials>=6.11.2,<6.12"]

[project.urls]
Homepage = "https://github.com/scshafe/scshafe-qt"
Documentation = "https://github.com/scshafe/scshafe-qt#readme"
Repository = "https://github.com/scshafe/scshafe-qt"
Issues = "https://github.com/scshafe/scshafe-qt/issues"
Changelog = "https://github.com/scshafe/scshafe-qt/blob/main/CHANGELOG.md"
Releases = "https://github.com/scshafe/scshafe-qt/releases"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under the package ships, including the QML module
# (qml/Scshafe/Ui/qmldir and *.qml), with no MANIFEST.in.
packages = ["src/scshafe_qt"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools",
    "/tokens",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
# Any Qt/QML warning (binding errors, unknown properties, ...) fails the test.
qt_log_level_fail = "WARNING"
# Except one: on macOS the offscreen platform's theme font is "Sans Serif", which macOS
# lacks, so Qt warns that resolving it was slow. Headless-only (cocoa uses the system font).
qt_log_ignore = ["^Populating font family aliases took .* missing font family \"Sans Serif\""]

[tool.uv]
# The toolchain pin (LIB-04's analogue): CI's setup-uv reads this version.
required-version = "==0.12.21"
