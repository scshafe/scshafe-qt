[project]
name = "scshafe-qt"
version = "0.0.0"
description = "The SCSHAFE native component library: the Scshafe.Ui QML module (Qt Quick) for PySide6 apps, themed from the @scshafe/ui token registry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "scshafe-qt contributors" }]
# PySide6 6.11.x wheels (abi3, cp310) declare requires-python ">=3.10,<3.15";
# the lower bound is the oldest Python the library is tested on
# (.python-version pins 3.14).
requires-python = ">=3.14,<3.15"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
]
# Range policy: the library accepts the Qt minor it is built and tested on
# (6.11.x, ">=<tested patch>,<next minor>"); an app pins one exact version in
# its own uv.lock. Open-source Qt patch releases track the current minor
# only (6.8 LTS patches for open source ended at 6.8.3), so the library
# follows the current minor: moving to the next one (6.12) is a minor bump
# of this library with a changelog entry.
dependencies = ["PySide6-Essentials>=6.11.2,<6.12"]

[project.urls]
Repository = "https://github.com/scshafe/scshafe-qt"
Changelog = "https://github.com/scshafe/scshafe-qt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under the package ships, including the QML module
# (qml/Scshafe/Ui/qmldir and *.qml), with no MANIFEST.in.
packages = ["src/scshafe_qt"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools",
    "/tokens",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"

[tool.uv]
# The toolchain pin (LIB-04's analogue): CI's setup-uv reads this version.
required-version = "==0.12.21"
