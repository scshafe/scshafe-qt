name: CI

# Linux on every push and pull request. macOS (GitHub-hosted, Apple Silicon)
# only on release tags, by hand and weekly: hosted macOS minutes bill at 10x on
# a private repository. Publishing is publish.yml's job (Q2), not this one.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

# Every dependency comes from PyPI; nothing private is read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The system libraries the PySide6 6.8 wheels link (readelf NEEDED of
      # libQt6Gui, libQt6Quick, libQt6DBus and the offscreen platform plugin;
      # ICU is bundled) and one font family for text rendering.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6 \
            libx11-6 libglib2.0-0t64 libdbus-1-3 fonts-dejavu-core
      # astral-sh/setup-uv v10.2.0; the uv version comes from pyproject.toml
      # [tool.uv] required-version, Python from .python-version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - name: Generated tokens are current
        run: uv run --frozen python tools/gen_tokens.py --check
      - name: Tests (offscreen)
        run: uv run --frozen pytest -v
      - name: Build wheel and sdist, check payload, install and load the wheel
        run: |
          uv build
          uv run --frozen python tools/check_dist.py --smoke

  macos:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - run: uv run --frozen python tools/gen_tokens.py --check
      - run: uv run --frozen pytest -v
      - run: |
          uv build
          uv run --frozen python tools/check_dist.py --smoke
